<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>الصفحة غير موجودة | نور</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <main class="container" style="min-height:100vh;display:grid;place-items:center;text-align:center;gap:14px;padding:40px 0">
    <p class="kicker">خطأ 404</p>
    <h1 style="font-size:clamp(28px,5vw,44px)">هذه الصفحة غير موجودة</h1>
    <p class="lead sm">ربما تغيّر الرابط أو كُتب بشكل مختلف. يمكنك الانتقال إلى أحد الأقسام:</p>
    <nav class="footer-links" aria-label="أقسام الموقع" style="border-top:0">
        <a href="/">الرئيسية</a>
        <a href="/اوقات-الصلاة">مواقيت الصلاة</a>
        <a href="/القرآن-الكريم">القرآن الكريم</a>
        <a href="/الأذكار-اليومية">الأذكار اليومية</a>
        <a href="/المسبحة-الرقمية">المسبحة الرقمية</a>
        <a href="/أسماء-الله-الحسنى">أسماء الله الحسنى</a>
        <a href="/اتجاه-القبلة">اتجاه القبلة</a>
    </nav>
  </main>
  <script>
    (function () {
      var routes = [["/","/"],["/اوقات-الصلاة","/اوقات-الصلاة"],["/القرآن-الكريم","/القرآن-الكريم"],["/الأذكار-اليومية","/الأذكار-اليومية"],["/المسبحة-الرقمية","/المسبحة-الرقمية"],["/أسماء-الله-الحسنى","/أسماء-الله-الحسنى"],["/اتجاه-القبلة","/اتجاه-القبلة"]];
      function loose(v) {
        return decodeURI(v).replace(/\/index\.html?$/i, '/').replace(/\.html?$/i, '')
          .replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/\/+$/, '').toLowerCase();
      }
      var path = loose(location.pathname);
      for (var i = 0; i < routes.length; i++) {
        if (loose(routes[i][0]) === path) { location.replace(routes[i][1]); return; }
      }
    })();
  </script>
</body>
</html>
